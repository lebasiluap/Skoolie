<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#EEF2F1;padding:32px 16px;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background-color:#FFFFFF;border-radius:20px;border:1px solid #E2E9E6;padding:32px 28px;font-family:'Segoe UI',Arial,sans-serif;">
        <tr>
          <td align="center" style="padding-bottom:20px;">
            <span style="font-size:24px;font-weight:800;color:#16221F;">Skoolie</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:8px;">
            <span style="font-size:20px;font-weight:800;color:#16221F;">Confirm your email</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:26px;">
            <span style="font-size:14px;color:#56655F;line-height:21px;">

            </span>

        </tr>
        <tr>
          <td align="center" style="padding-bottom:26px;">
            <a href="{{ .ConfirmationURL }}" target="_blank"

              Confirm my email
            </a>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:6px;">
            <span style="font-size:13px;color:#5E706A;">This link expires in 24 hours.</span>
          </td>
        </tr>
        <tr>
          <td align="center">
            <span style="font-size:13px;color:#5E706A;line-height:19px;">
              If you didn't create a Skoolie account,<br/>you can safely ignore this email.
            </span>
          </td>
        </tr>
      </table>
      <table width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;">
        <tr>
          <td align="center" style="padding-top:16px;">
            <span style="font-size:12px;color:#5E706A;font-family:'Segoe UI',Arial,sans-serif;">Skoolie · Exam prep for healthcare students</span>
          </td>
        </tr>
      </table>
    </td>
